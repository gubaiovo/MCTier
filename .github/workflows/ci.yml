name: Build and release

on:
  pull_request:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild (for example v2.8.0 or v2.8.0-rc.1)
        required: true
        type: string
      publish:
        description: Replace assets on the tag's GitHub Release after all checks pass
        required: true
        default: false
        type: boolean
  schedule:
    # 02:00 Asia/Shanghai (18:00 UTC on the previous calendar day).
    - cron: '0 18 * * *'

permissions:
  contents: read

concurrency:
  group: mctier-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  metadata:
    name: Resolve build metadata
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      channel: ${{ steps.resolve.outputs.channel }}
      publish: ${{ steps.resolve.outputs.publish }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      tag: ${{ steps.resolve.outputs.tag }}
      retention_days: ${{ steps.resolve.outputs.retention_days }}
    steps:
      - name: Resolve event policy
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          checkout_ref="$GIT_SHA"
          channel="pr"
          publish="false"
          prerelease="false"
          tag=""
          retention_days="3"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "Manual rebuilds require vX.Y.Z or vX.Y.Z-rc.N; received: $tag" >&2
              exit 1
            fi
            git ls-remote --exit-code --tags "https://github.com/${REPOSITORY}.git" "refs/tags/$tag" >/dev/null
            checkout_ref="refs/tags/$tag"
            channel="$tag"
            publish="${INPUT_PUBLISH:-false}"
            retention_days="14"
          elif [[ "$GIT_REF" == refs/tags/* ]]; then
            tag="${GIT_REF#refs/tags/}"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "Release tags must use vX.Y.Z or vX.Y.Z-rc.N; received: $tag" >&2
              exit 1
            fi
            checkout_ref="$GIT_REF"
            channel="$tag"
            publish="true"
            retention_days="30"
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            channel="nightly-$(date -u +%Y%m%d)"
            retention_days="7"
          elif [[ "$GIT_REF" == "refs/heads/master" || "$GIT_REF" == "refs/heads/main" ]]; then
            channel="dev-${GIT_SHA:0:7}"
            retention_days="14"
          else
            channel="pr-${GIT_SHA:0:7}"
          fi

          if [[ "$tag" == *-rc.* ]]; then
            prerelease="true"
          fi

          {
            echo "checkout_ref=$checkout_ref"
            echo "channel=$channel"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
            echo "tag=$tag"
            echo "retention_days=$retention_days"
          } >>"$GITHUB_OUTPUT"

      - name: Check out selected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.resolve.outputs.checkout_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged versions are synchronized
        if: steps.resolve.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const tag = process.env.RELEASE_TAG;
          const match = /^v(\d+\.\d+\.\d+)(?:-rc\.\d+)?$/.exec(tag);
          if (!match) throw new Error(`Invalid release tag: ${tag}`);
          const expected = match[1];

          const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const tauriVersion = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargoText = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = /^version\s*=\s*"([^"]+)"/m.exec(cargoText)?.[1];
          const gradleText = fs.readFileSync('MCTier-Android/app/build.gradle.kts', 'utf8');
          const androidVersion = /versionName\s*=\s*"(\d+\.\d+\.\d+)-android"/.exec(gradleText)?.[1];

          const versions = { packageVersion, tauriVersion, cargoVersion, androidVersion };
          for (const [source, actual] of Object.entries(versions)) {
            if (actual !== expected) {
              throw new Error(`${source}=${actual ?? '<missing>'}, but ${tag} requires ${expected}`);
            }
          }
          console.log(`Version synchronization verified for ${tag}.`);
          NODE

  frontend:
    name: Frontend quality
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting check
        run: npm run format:check

      - name: Typecheck and production frontend build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Audit runtime dependencies
        run: npm audit --registry=https://registry.npmjs.org --omit=dev --audit-level=high

  rust:
    name: Rust quality and tests
    needs: metadata
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Fetch pinned Windows runtime binaries
        run: .\scripts\fetch-binaries.ps1

      - name: Stage compile-only EasyTier placeholders
        # easytier-core/cli 不再从官方发布包获取：官方构建在 PE 导入表中静态导入
        # Npcap 的 packet.dll，而 Npcap 不得随本项目再分发（见 THIRD_PARTY_NOTICES.md §8）。
        # 真实产物由 scripts/build-easytier-npcap-free.ps1 重建，但那需要克隆并完整编译
        # 一遍 EasyTier（数分钟以上），对每次 CI 而言过于昂贵。
        #
        # 本任务只验证「代码能否编译、单元测试是否通过」，全程不执行这两个二进制，
        # 因此放占位文件让 include_bytes! 有东西可读即可。占位内容刻意是可识别的文本：
        # 一旦被误用于发行构建，EasyTier 会立即以明显的方式失败，而不是悄悄产出坏包。
        run: |
          $dir = 'src-tauri/resources/binaries'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($name in @('easytier-core.exe', 'easytier-cli.exe')) {
            $path = Join-Path $dir $name
            if (Test-Path -LiteralPath $path) { continue }
            Set-Content -LiteralPath $path -Encoding ascii -NoNewline -Value 'MCTIER-CI-PLACEHOLDER-NOT-A-REAL-BINARY'
            Write-Host "staged placeholder: $name"
          }
        shell: pwsh

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --lib --tests -- -D warnings

      - name: Compile all Rust targets
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

  linux:
    name: Linux (deps / check / test / shellcheck)
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: linux

      - name: Install system dependencies
        # Tauri 2 在 Linux 上需要 WebKitGTK + GTK3；libcap2-bin 提供 setcap/getcap，
        # 运行期用来给 easytier 二进制授予 TUN 能力（应用本体不提权）。
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config libcap2-bin unzip

      - name: Fetch third-party binaries (Linux)
        # resource_manager.rs 在 Linux 上 include_bytes! 内嵌 EasyTier 的 Linux 二进制，
        # 这些文件不入库，编译前必须先获取并校验 SHA-256。
        run: ./MCTier-Linux/scripts/fetch-binaries.sh

      - name: Check
        working-directory: src-tauri
        # Linux 侧的 cfg 分支只有在 Linux 目标上才会被编译，Windows 任务覆盖不到，
        # 因此这一步是 Linux 代码唯一的真实编译验证。
        run: cargo check --lib --tests

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --lib --tests -- -D warnings

      - name: Shellcheck Linux scripts
        # 这些脚本会带 sudo/pkexec 执行，未加引号的变量展开可能造成实际危害，必须阻塞。
        run: |
          set -e
          sudo apt-get install -y shellcheck
          shellcheck MCTier-Linux/scripts/*.sh

      - name: Validate desktop entry and polkit policy
        run: |
          set -e
          sudo apt-get install -y desktop-file-utils libxml2-utils
          desktop-file-validate MCTier-Linux/packaging/mctier.desktop
          xmllint --noout MCTier-Linux/packaging/com.mctier.app.policy

  compliance:
    name: License compliance
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Verify notices and corresponding source material
        run: |
          set -euo pipefail
          for file in LICENSE THIRD_PARTY_NOTICES.md LICENSE-LGPL-3.0.txt LICENSE-GPL-3.0.txt; do
            test -f "$file" || { echo "missing $file" >&2; exit 1; }
          done
          for file in licenses/LICENSE-Apache-2.0.txt licenses/LICENSE-MIT.txt \
                      licenses/LICENSE-BSD-3-Clause.txt licenses/LICENSE-GPL-2.0.txt \
                      licenses/LICENSE-GPL-3.0.txt licenses/LICENSE-LGPL-3.0.txt \
                      licenses/LICENSE-Wintun.txt; do
            test -f "$file" || { echo "missing $file" >&2; exit 1; }
          done
          for component in EasyTier Wintun WinDivert Npcap LocalVQE GGML; do
            grep -q "$component" THIRD_PARTY_NOTICES.md || {
              echo "$component missing from THIRD_PARTY_NOTICES.md" >&2
              exit 1
            }
          done
          test -f patches/easytier-2.6.0-mctier-android.patch
          test -f patches/pnet_datalink-0.35.0-no-npcap.patch

      - name: Verify no Npcap file is bundled
        run: |
          set -euo pipefail
          for file in Packet.dll Packet.lib; do
            test ! -e "src-tauri/resources/binaries/$file" || {
              echo "$file must not be bundled" >&2
              exit 1
            }
          done
          ! grep -rn 'include_bytes!.*Packet\.dll' src-tauri/src || {
            echo 'Packet.dll is still embedded' >&2
            exit 1
          }

  dependency-audit:
    name: Rust dependency audit
    if: github.event_name != 'pull_request'
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install audit tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked

      - name: cargo audit (upstream findings remain visible)
        continue-on-error: true
        working-directory: src-tauri
        run: cargo audit

      - name: cargo deny (upstream findings remain visible)
        continue-on-error: true
        working-directory: src-tauri
        run: cargo deny check

  desktop:
    name: Desktop package (${{ matrix.name }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            id: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Intel
            id: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macOS Apple Silicon
            id: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install stable Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Cache verified macOS EasyTier binaries
        if: runner.os == 'macOS'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            src-tauri/resources/binaries/easytier-core
            src-tauri/resources/binaries/easytier-cli
          key: mctier-easytier-macos-${{ matrix.target }}-v2.6.4

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch pinned Windows runtime binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\fetch-binaries.ps1

      - name: Cache rebuilt Windows EasyTier binaries
        if: runner.os == 'Windows'
        id: windows-easytier-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            src-tauri/resources/binaries/easytier-core.exe
            src-tauri/resources/binaries/easytier-cli.exe
            src-tauri/resources/binaries/easytier-core-x86_64-pc-windows-msvc.exe
            src-tauri/resources/binaries/easytier-cli-x86_64-pc-windows-msvc.exe
          key: mctier-easytier-windows-v2.5.0-${{ hashFiles('scripts/build-easytier-npcap-free.ps1', 'patches/pnet_datalink-0.35.0-no-npcap.patch') }}

      - name: Build Npcap-free Windows EasyTier binaries
        if: runner.os == 'Windows' && steps.windows-easytier-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (-not (Get-Command protoc -ErrorAction SilentlyContinue)) {
            choco install protoc --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "protoc installation failed with exit code $LASTEXITCODE" }
            $env:PATH = "$env:ChocolateyInstall\bin;$env:PATH"
            "$env:ChocolateyInstall\bin" >> $env:GITHUB_PATH
          }

          $libclang = 'C:\Program Files\LLVM\bin\libclang.dll'
          if (-not (Test-Path -LiteralPath $libclang)) {
            throw "GitHub runner LLVM installation is missing $libclang"
          }
          $env:LIBCLANG_PATH = [IO.Path]::GetDirectoryName($libclang)
          "LIBCLANG_PATH=$env:LIBCLANG_PATH" >> $env:GITHUB_ENV

          .\scripts\build-easytier-npcap-free.ps1

      - name: Fetch pinned macOS runtime binaries
        if: runner.os == 'macOS'
        run: ./scripts/fetch-macos-binaries.sh "${{ matrix.target == 'aarch64-apple-darwin' && 'arm64' || 'x86_64' }}"

      - name: Import Windows release certificate
        if: runner.os == 'Windows' && needs.metadata.outputs.publish == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'WINDOWS_CERTIFICATE_BASE64','WINDOWS_CERTIFICATE_PASSWORD','WINDOWS_TIMESTAMP_URL') {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "Required release secret is missing: $name"
            }
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'mctier-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          if (-not $certificate.Thumbprint) { throw 'The Windows certificate was not imported.' }

          $configPath = Join-Path $env:RUNNER_TEMP 'tauri-windows-signing.json'
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              }
            }
          } | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText($configPath, $config)
          "MCTIER_TAURI_SIGNING_CONFIG=$configPath" >> $env:GITHUB_ENV

      - name: Configure ad-hoc macOS signing
        if: runner.os == 'macOS' && needs.metadata.outputs.publish != 'true'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >>"$GITHUB_ENV"

      - name: Import macOS release certificate
        if: runner.os == 'macOS' && needs.metadata.outputs.publish == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MCTIER_APPLE_ID: ${{ secrets.APPLE_ID }}
          MCTIER_APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MCTIER_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD \
                      MCTIER_APPLE_ID MCTIER_APPLE_PASSWORD MCTIER_APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required release secret is missing: $name" >&2
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/mctier-signing.p12"
          keychain_path="$RUNNER_TEMP/mctier-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | openssl base64 -d -A >"$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | sed -n 's/.*"\([^"]*\)".*/\1/p' \
              | head -n 1
          )"
          if [[ -z "$signing_identity" ]]; then
            echo 'No macOS code-signing identity was found in the imported certificate.' >&2
            exit 1
          fi
          {
            echo "APPLE_SIGNING_IDENTITY=$signing_identity"
            echo "MCTIER_KEYCHAIN_PATH=$keychain_path"
          } >>"$GITHUB_ENV"

      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $arguments = @('run', 'tauri', 'build', '--', '--target', $env:TARGET, '--bundles', 'nsis', '--ci')
          if ($env:MCTIER_TAURI_SIGNING_CONFIG) {
            $arguments += @('--config', $env:MCTIER_TAURI_SIGNING_CONFIG)
          }
          & npm @arguments
          if ($LASTEXITCODE -ne 0) { throw "Tauri build failed with exit code $LASTEXITCODE" }

      - name: Build ad-hoc signed macOS app
        if: runner.os == 'macOS' && needs.metadata.outputs.publish != 'true'
        run: npm run tauri build -- --target "${{ matrix.target }}" --bundles app --ci

      - name: Create deterministic macOS test disk image
        if: runner.os == 'macOS' && needs.metadata.outputs.publish != 'true'
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          app="$(find "$bundle_root/macos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$app"

          payload="$(mktemp -d "$RUNNER_TEMP/mctier-dmg.XXXXXX")"
          cp -R "$app" "$payload/"
          ln -s /Applications "$payload/Applications"

          mkdir -p "$bundle_root/dmg"
          dmg="$bundle_root/dmg/MCTier_${{ matrix.id }}.dmg"
          hdiutil create -volname MCTier -srcfolder "$payload" -ov -format UDZO "$dmg"
          test -f "$dmg"

      - name: Build signed and notarized macOS DMG
        if: runner.os == 'macOS' && needs.metadata.outputs.publish == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target "${{ matrix.target }}" --bundles dmg --ci

      - name: Smoke-test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          REQUIRE_SIGNATURE: ${{ needs.metadata.outputs.publish }}
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/$env:TARGET/release/bundle/nsis" -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)." }
          & 7z t $installers[0].FullName
          if ($LASTEXITCODE -ne 0) { throw '7-Zip could not test the NSIS installer.' }
          $listing = (& 7z l $installers[0].FullName) -join "`n"
          if ($listing -notmatch 'MCTier\.exe') { throw 'The installer does not contain MCTier.exe.' }
          if ($env:REQUIRE_SIGNATURE -eq 'true') {
            $signature = Get-AuthenticodeSignature $installers[0].FullName
            if ($signature.Status -ne 'Valid') {
              throw "Release installer signature is not valid: $($signature.Status)"
            }
          }

      - name: Smoke-test macOS disk image
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dmg="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -type f -print -quit)"
          test -n "$dmg"
          hdiutil verify "$dmg"
          mount_point="$RUNNER_TEMP/mctier-dmg-${{ matrix.id }}"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          app="$(find "$mount_point" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$app"
          test -x "$app/Contents/MacOS/mctier"
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil detach "$mount_point"

      - name: Stage desktop package
        run: |
          set -euo pipefail
          mkdir -p staging
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            find "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" \
              -maxdepth 1 -name '*.exe' -type f -exec cp '{}' staging/ \;
          else
            find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" \
              -maxdepth 1 -name '*.dmg' -type f -exec cp '{}' staging/ \;
          fi
          test -n "$(find staging -maxdepth 1 -type f -print -quit)"

      - name: Upload desktop package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packages-${{ needs.metadata.outputs.channel }}-${{ matrix.id }}
          path: staging/*
          if-no-files-found: error
          retention-days: ${{ needs.metadata.outputs.retention_days }}

      - name: Remove temporary macOS keychain
        if: always() && runner.os == 'macOS' && env.MCTIER_KEYCHAIN_PATH != ''
        run: security delete-keychain "$MCTIER_KEYCHAIN_PATH" || true

  android:
    name: Android package (arm64-v8a)
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-home-cache-cleanup: true

      - name: Configure Android release signing
        if: needs.metadata.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
                      ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required release secret is missing: $name" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/mctier-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode >"$keystore"
          {
            echo "MCTIER_ANDROID_KEYSTORE_PATH=$keystore"
            echo "MCTIER_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "MCTIER_ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "MCTIER_ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >>"$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: needs.metadata.outputs.publish == 'true'
        working-directory: MCTier-Android
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            extra=()
            if (( attempt > 1 )); then extra+=(--refresh-dependencies); fi
            if ./gradlew :app:assembleRelease :app:bundleRelease \
                 --no-daemon --stacktrace "${extra[@]}"; then
              exit 0
            fi
            if (( attempt == 3 )); then exit 1; fi
            echo "Gradle dependency resolution failed (attempt $attempt/3); retrying..." >&2
            sleep $((attempt * 15))
          done

      - name: Build debug APK
        if: needs.metadata.outputs.publish != 'true'
        working-directory: MCTier-Android
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            extra=()
            if (( attempt > 1 )); then extra+=(--refresh-dependencies); fi
            if ./gradlew :app:assembleDebug --no-daemon --stacktrace "${extra[@]}"; then
              exit 0
            fi
            if (( attempt == 3 )); then exit 1; fi
            echo "Gradle dependency resolution failed (attempt $attempt/3); retrying..." >&2
            sleep $((attempt * 15))
          done

      - name: Smoke-test APK and release bundle
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [[ "${{ needs.metadata.outputs.publish }}" == "true" ]]; then
            apk="MCTier-Android/app/build/outputs/apk/release/app-release.apk"
            bundle="MCTier-Android/app/build/outputs/bundle/release/app-release.aab"
            test -f "$bundle"
            jarsigner -verify -strict "$bundle"
          else
            apk="MCTier-Android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -f "$apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/aapt" dump badging "$apk" | grep -q "package: name='top.pmh13.mctier'"
          manifest_tree="$("$build_tools/aapt" dump xmltree "$apk" AndroidManifest.xml)"
          grep -q 'usesCleartextTraffic.*0xffffffff' <<<"$manifest_tree"
          network_security_tree="$("$build_tools/aapt" dump xmltree "$apk" res/xml/network_security_config.xml)"
          grep -q 'E: base-config' <<<"$network_security_tree"
          grep -q 'cleartextTrafficPermitted.*0xffffffff' <<<"$network_security_tree"
          if grep -q 'E: domain-config' <<<"$network_security_tree"; then
            echo 'Packaged network security config must not restrict runtime private signaling domains.' >&2
            exit 1
          fi
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libeasytier_android_jni.so'
          unzip -l "$apk" | grep -q 'assets/THIRD_PARTY_NOTICES.md'

      - name: Stage Android packages
        run: |
          set -euo pipefail
          mkdir -p staging
          if [[ "${{ needs.metadata.outputs.publish }}" == "true" ]]; then
            cp MCTier-Android/app/build/outputs/apk/release/app-release.apk \
              staging/MCTier-Android-arm64-v8a.apk
            cp MCTier-Android/app/build/outputs/bundle/release/app-release.aab \
              staging/MCTier-Android-arm64-v8a.aab
          else
            cp MCTier-Android/app/build/outputs/apk/debug/app-debug.apk \
              "staging/MCTier-Android-arm64-v8a-${{ needs.metadata.outputs.channel }}-debug.apk"
          fi

      - name: Upload Android packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packages-${{ needs.metadata.outputs.channel }}-android-arm64
          path: staging/*
          if-no-files-found: error
          retention-days: ${{ needs.metadata.outputs.retention_days }}

  release:
    name: Publish GitHub Release
    if: needs.metadata.outputs.publish == 'true'
    needs:
      - metadata
      - frontend
      - rust
      - linux
      - compliance
      - dependency-audit
      - desktop
      - android
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: packages-${{ needs.metadata.outputs.channel }}-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -r sha256sum >SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS

      - name: Create or update release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            echo 'Publishing requires an existing version tag.' >&2
            exit 1
          fi

          prerelease_args=()
          latest_args=(--latest)
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease_args=(--prerelease)
            latest_args=(--latest=false)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --verify-tag \
              --title "MCTier $RELEASE_TAG" \
              --prerelease="$PRERELEASE" \
              "${latest_args[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "MCTier $RELEASE_TAG" \
              --generate-notes \
              "${prerelease_args[@]}" \
              "${latest_args[@]}"
          fi

          while IFS= read -r -d '' asset; do
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          done < <(find release-assets -maxdepth 1 -type f -print0)

      - name: Publish run summary
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: echo "Published [$RELEASE_TAG](https://github.com/${GITHUB_REPOSITORY}/releases/tag/$RELEASE_TAG)" >>"$GITHUB_STEP_SUMMARY"
